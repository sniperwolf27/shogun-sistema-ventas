<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
    <title>404 — Shogun</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/shared.css">
    <script>
        (function(){var t=localStorage.getItem('theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
    </script>
    <style>
        body{font-family:var(--font-body);background:var(--surface-secondary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
        .error-card{background:var(--surface-primary);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);padding:var(--sp-3xl);max-width:440px;width:100%;animation:cardIn 0.6s var(--ease-spring)}
        .error-code{font-family:var(--font-display);font-size:72px;font-weight:700;color:var(--text-quaternary);line-height:1;margin-bottom:var(--sp-md)}
        .error-title{font-family:var(--font-display);font-size:var(--text-title2);font-weight:600;color:var(--text-primary);margin-bottom:var(--sp-sm)}
        .error-desc{color:var(--text-tertiary);font-size:var(--text-body);margin-bottom:var(--sp-xl)}
        .error-link{display:inline-flex;align-items:center;gap:var(--sp-xs);padding:12px 24px;background:var(--accent);color:var(--text-inverted);border-radius:var(--radius-full);font-weight:600;text-decoration:none;transition:all var(--duration-normal) var(--ease-spring);min-height:var(--touch-min)}
        .error-link:hover{background:var(--accent-hover)}
        .error-link:active{transform:scale(0.97)}
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-desc">La página que buscas no existe o fue movida.</p>
        <a href="/backoffice" class="error-link">Ir al inicio</a>
    </div>
</body>
</html>
