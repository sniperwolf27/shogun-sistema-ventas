<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
    <title>Login — Shogun</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Shared design system -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script>
        // Apply theme immediately to prevent flash (respects OS preference on first visit)
        (function(){var t=localStorage.getItem('theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
    </script>

    <style>
        /* ═══════════════════════════════════════════════════════════════
           SHOGUN — Login v5.0
           Apple HIG — Tokens from /css/tokens.css
           ═══════════════════════════════════════════════════════════════ */

        /* Login-specific layout (shared styles from /css/shared.css) */
        body{font-family:var(--font-body);background:var(--surface-secondary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}

        .login-card{background:var(--surface-primary);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:100%;max-width:400px;overflow:hidden;animation:cardIn 0.6s var(--ease-spring)}
        .login-header{padding:var(--sp-2xl) 36px var(--sp-xl);text-align:center}
        .login-header .logo-img{margin:0 auto var(--sp-lg)}
        .login-header h1{font-family:var(--font-display);font-size:var(--text-title1);font-weight:700;letter-spacing:-0.5px;color:var(--text-primary);margin-bottom:var(--sp-xs)}
        .login-header p{color:var(--text-tertiary);font-size:var(--text-body)}
        .login-body{padding:0 36px 40px}

        /* Login-specific: override form-control font-size for iOS zoom prevention */
        .login-body .form-control{font-size:16px}
        .login-body .form-group{margin-bottom:var(--sp-lg)}

        /* Login button */
        .btn-login{width:100%;padding:14px;background:var(--accent);color:var(--text-inverted);border:none;border-radius:var(--radius-full);font-family:var(--font-body);font-size:16px;font-weight:600;cursor:pointer;transition:all var(--duration-normal) var(--ease-spring);display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);margin-top:var(--sp-sm);min-height:var(--touch-min)}
        .btn-login:active{transform:scale(0.97);transition-duration:0.1s}
        .btn-login:hover{background:var(--accent-hover);opacity:0.85}
        .btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}

        .login-footer{text-align:center;padding:var(--sp-lg) 36px;background:var(--surface-secondary);border-top:1px solid var(--border-primary)}
        .login-footer p{font-size:var(--text-micro);color:var(--text-tertiary)}

        @media(max-width:480px){
            .login-header{padding:36px 24px var(--sp-lg)}
            .login-body{padding:0 24px var(--sp-xl)}
            .login-footer{padding:var(--sp-md) 24px}
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="/black-shogun-logo.svg" class="logo-img logo-lg logo-img-light" alt="Shogun">
            <img src="/white-shogun-logo.svg" class="logo-img logo-lg logo-img-dark" alt="Shogun">
            <h1>Shogun</h1>
            <p>Gestión de Ventas</p>
        </div>

        <div class="login-body">
            <div id="alert" class="alert alert-error">
                <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
                <span id="alertMessage"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
                        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    Iniciar sesión
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>&copy; 2026 Shogun. Todos los derechos reservados.</p>
        </div>
    </div>

    <script>
    (function() {
        const API_BASE = window.location.origin + '/api';
        const supabase = window.initSupabase();

        const alertBox = document.getElementById('alert');
        const alertMsg = document.getElementById('alertMessage');
        const btn = document.getElementById('btnLogin');
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner spinner-sm spinner-inverted"></div>';
            alertBox.classList.remove('show');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw new Error('Credenciales incorrectas');

                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${data.session.access_token}`
                    }
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'No autorizado');
                }

                localStorage.setItem('sb_access_token', data.session.access_token);
                if (data.session.refresh_token) {
                    localStorage.setItem('sb_refresh_token', data.session.refresh_token);
                }
                localStorage.setItem('user', JSON.stringify(result.user));

                window.location.href = '/backoffice';

            } catch (err) {
                alertMsg.textContent = err.message;
                alertBox.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Iniciar sesión';
            }
        });
    })();
    </script>
</body>
</html>
