<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice — Shogun</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/modals.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- P11: Skip to content -->
    <a href="#main-content" class="skip-link">Saltar al contenido</a>

    <!-- HEADER — P10: minimal chrome -->
    <header class="top-bar">
        <div class="top-bar-brand">
            <div class="logo-mark">S</div>
            <h1>Shogun</h1>
        </div>
        <div class="top-bar-actions">
            <!-- NUEVO: Botón Nuevo Pedido -->
            <button class="btn btn-primary" onclick="nuevoPedido()" aria-label="Crear nuevo pedido">
                <i class="fas fa-plus"></i> Nuevo Pedido
            </button>
            <div class="user-info" id="userInfo">
                <i class="fas fa-circle-user"></i>
                <span>Cargando...</span>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleDarkMode()" aria-label="Cambiar tema">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn btn-secondary" onclick="exportarExcel()" aria-label="Exportar pedidos">
                <i class="fas fa-arrow-down-to-line"></i> Exportar
            </button>
            <button class="btn btn-danger" onclick="Auth.logout()" aria-label="Cerrar sesión">
                <i class="fas fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <!-- NAV — P10: text only, no icons -->
    <nav class="nav-tabs" role="tablist" aria-label="Secciones">
        <button class="tab-btn active" data-tab="pedidos" role="tab" aria-selected="true">
            <i class="fas fa-shopping-cart"></i> Pedidos
        </button>
        <button class="tab-btn" data-tab="dashboard" role="tab" aria-selected="false">
            <i class="fas fa-chart-line"></i> Dashboard
        </button>
        <button class="tab-btn" data-tab="pendientes" role="tab" aria-selected="false">
            <i class="fas fa-triangle-exclamation"></i> Pendientes
        </button>
        <!-- NUEVO: Tab de Parámetros -->
        <button class="tab-btn" data-tab="parametros" role="tab" aria-selected="false">
            <i class="fas fa-cog"></i> Parámetros
        </button>
    </nav>

    <main id="main-content" class="container">
        <!-- ═══════ PEDIDOS ═══════ -->
        <div id="pedidos-section" class="tab-content active" role="tabpanel">
            <div class="section-header">
                <h2>Pedidos</h2>
            </div>

            <div class="filters">
                <div class="search-wrapper">
                    <i class="fas fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchPedidos" placeholder="Buscar por ID, cliente, producto..." aria-label="Buscar pedidos">
                    <div class="kbd-hint"><kbd>⌘</kbd><kbd>K</kbd></div>
                </div>
                <select id="filterEstado" aria-label="Filtrar por estado">
                    <option value="">Estado</option>
                    <option value="En Producción">En Producción</option>
                    <option value="Listo para Envío">Listo para Envío</option>
                    <option value="En Camino">En Camino</option>
                    <option value="Entregado">Entregado</option>
                    <option value="Bloqueado - Sin Dirección">Bloqueado</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
                <select id="filterCanal" aria-label="Filtrar por canal">
                    <option value="">Canal</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Referido">Referido</option>
                    <option value="Tienda">Tienda</option>
                </select>
            </div>

            <div class="table-container">
                <table id="tabla-pedidos" aria-label="Lista de pedidos">
                    <thead>
                        <tr>
                            <th style="width: 40px;">
                                <input type="checkbox" class="order-checkbox" id="select-all-checkbox" onchange="toggleSelectAll()" aria-label="Seleccionar todos">
                            </th>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th><span class="sr-only">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- ═══════ DASHBOARD ═══════ -->
        <div id="dashboard-section" class="tab-content" role="tabpanel">
            <div class="section-header">
                <h2>Dashboard</h2>
            </div>

            <div class="dashboard-filters">
                <label>Desde</label>
                <input type="date" id="dashFechaDesde" aria-label="Fecha desde">
                <label>Hasta</label>
                <input type="date" id="dashFechaHasta" aria-label="Fecha hasta">
                <button class="btn btn-secondary" onclick="cargarDashboard()" aria-label="Aplicar filtro">Aplicar</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">Pedidos</div>
                    <div class="value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Ventas</div>
                    <div class="value" id="stat-ventas">RD$0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Ganancia</div>
                    <div class="value" id="stat-ganancia">RD$0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Pendientes</div>
                    <div class="value" id="stat-pendientes">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Entregados</div>
                    <div class="value" id="stat-entregados">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Margen</div>
                    <div class="value" id="stat-margen">0%</div>
                </div>
            </div>

            <div class="charts-row">
                <div class="chart-card">
                    <h3>Ventas por Canal</h3>
                    <canvas id="chartCanal" height="260"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Estado de Pedidos</h3>
                    <canvas id="chartEstados" height="260"></canvas>
                </div>
            </div>
        </div>

        <!-- ═══════ PENDIENTES ═══════ -->
        <div id="pendientes-section" class="tab-content" role="tabpanel">
            <div class="section-header">
                <h2>Pedidos Pendientes</h2>
            </div>
            <div id="lista-pendientes"></div>
        </div>

        <!-- ═══════ PARÁMETROS (NUEVO) ═══════ -->
        <div id="parametros-section" class="tab-content" role="tabpanel">
            <div class="section-header">
                <h2>Parámetros</h2>
            </div>

            <!-- Sub-tabs de Parámetros -->
            <div class="param-tabs">
                <button class="param-tab active" data-param-tab="productos">
                    <i class="fas fa-box"></i> Productos
                </button>
                <button class="param-tab" data-param-tab="categorias">
                    <i class="fas fa-tags"></i> Categorías
                </button>
                <button class="param-tab" data-param-tab="personalizaciones">
                    <i class="fas fa-palette"></i> Personalizaciones
                </button>
            </div>

            <!-- Contenido: Productos -->
            <div class="param-content active" data-param-content="productos">
                <div class="param-header-actions">
                    <button class="btn btn-primary" onclick="nuevoProducto()">
                        <i class="fas fa-plus"></i> Nuevo Producto
                    </button>
                </div>
                <div class="param-grid" id="productos-grid"></div>
            </div>

            <!-- Contenido: Categorías -->
            <div class="param-content" data-param-content="categorias">
                <div class="param-header-actions">
                    <button class="btn btn-primary" onclick="nuevaCategoria()">
                        <i class="fas fa-plus"></i> Nueva Categoría
                    </button>
                </div>
                <div class="param-grid" id="categorias-grid"></div>
            </div>

            <!-- Contenido: Personalizaciones -->
            <div class="param-content" data-param-content="personalizaciones">
                <div class="param-header-actions">
                    <button class="btn btn-primary" onclick="nuevaPersonalizacion()">
                        <i class="fas fa-plus"></i> Nueva Personalización
                    </button>
                </div>
                <div class="param-grid" id="personalizaciones-grid"></div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS — load order matters -->
    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/modals.js"></script>
    <script src="/js/pedidos.js"></script>
    <script src="/js/parametros.js"></script>

    <script>
        // ═══════ INIT ═══════
        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            setupAutofocus();
            restorePersistentFilters();

            // User info
            const user = Auth.getUser();
            if (user) {
                document.getElementById('userInfo').innerHTML = `
                    <i class="fas fa-circle-user"></i>
                    <span><strong>${user.nombre || user.name || ''}</strong> · ${user.rol || user.role || ''}</span>
                `;
            }

            // Tab system principal
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;

                    // Actualizar tabs
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');

                    // Mostrar contenido
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`${tab}-section`).classList.add('active');

                    // Cargar datos según el tab
                    if (tab === 'pedidos') cargarPedidos();
                    else if (tab === 'dashboard') cargarDashboard();
                    else if (tab === 'pendientes') cargarPendientes();
                    else if (tab === 'parametros') cargarProductos();
                });
            });

            // Setup persistent filter listeners
            const searchInput = document.getElementById('searchPedidos');
            const filterEstado = document.getElementById('filterEstado');
            const filterCanal = document.getElementById('filterCanal');

            if (searchInput) {
                searchInput.addEventListener('input', debounce(() => {
                    FilterStore.save('search', searchInput.value);
                }, 500));
            }

            if (filterEstado) {
                filterEstado.addEventListener('change', () => {
                    FilterStore.save('estado', filterEstado.value);
                });
            }

            if (filterCanal) {
                filterCanal.addEventListener('change', () => {
                    FilterStore.save('canal', filterCanal.value);
                });
            }

            // Load initial data
            await cargarPedidos();
        });

        // Restore persistent filters
        function restorePersistentFilters() {
            const search = FilterStore.load('search');
            const estado = FilterStore.load('estado');
            const canal = FilterStore.load('canal');

            const searchInput = document.getElementById('searchPedidos');
            const filterEstado = document.getElementById('filterEstado');
            const filterCanal = document.getElementById('filterCanal');

            if (searchInput && search) searchInput.value = search;
            if (filterEstado && estado) filterEstado.value = estado;
            if (filterCanal && canal) filterCanal.value = canal;
        }

        // ═══════ NAVEGACIÓN ═══════
        function nuevoPedido() {
            window.open('/formulario', '_blank');
        }

        // ═══════ DASHBOARD ═══════
        let chartCanal, chartEstados;

        async function cargarDashboard() {
            showStatsSkeleton();

            try {
                const desde = document.getElementById('dashFechaDesde')?.value;
                const hasta = document.getElementById('dashFechaHasta')?.value;

                // Llamar a las tres APIs en paralelo
                const [stats, canales, estados] = await Promise.all([
                    api.getEstadisticas(desde, hasta),
                    api.getVentasPorCanal(desde, hasta),
                    api.getVentasPorEstado()
                ]);

                // Validar que tenemos datos
                if (!stats) {
                    throw new Error('No se recibieron datos del servidor');
                }

                // Actualizar estadísticas con animación
                animateValue('stat-total', 0, stats.total_pedidos || 0, 800, false);
                animateValue('stat-ventas', 0, stats.ventas_totales || 0, 800, true);
                animateValue('stat-ganancia', 0, stats.ganancia_neta || 0, 800, true);
                animateValue('stat-pendientes', 0, stats.pedidos_pendientes || 0, 800, false);
                animateValue('stat-entregados', 0, stats.pedidos_entregados || 0, 800, false);

                const margen = stats.margen_promedio || 0;
                document.getElementById('stat-margen').textContent = margen.toFixed(1) + '%';
                document.getElementById('stat-margen').style.color = margen >= 0 ? 'var(--success)' : 'var(--danger)';

                // Mapear datos para los gráficos (ajustando nombres de propiedades)
                const chartData = {
                    ...stats,
                    ventas_por_canal: (canales || []).map(c => ({
                        canal: c.canal,
                        total_pedidos: c.total,
                        ventas: c.ventas
                    })),
                    pedidos_por_estado: (estados || []).map(e => ({
                        estado: e.estado,
                        cantidad: e.total
                    }))
                };

                // Renderizar gráficos
                renderCharts(chartData);

            } catch (e) {
                console.error('Error dashboard:', e);
                showNotification('Error cargando estadísticas: ' + e.message, 'error');

                // Mostrar valores en 0 en caso de error
                ['stat-total', 'stat-ventas', 'stat-ganancia', 'stat-pendientes', 'stat-entregados'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = id === 'stat-margen' ? '0%' : (id.includes('ventas') || id.includes('ganancia') ? 'RD$0' : '0');
                });
            }
        }

        function animateValue(id, start, end, duration, isCurrency) {
            const el = document.getElementById(id);
            if (!el) return;

            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); // ease-out cubic

                const current = start + (end - start) * easeProgress;
                el.textContent = isCurrency ? formatearMoneda(current) : Math.round(current).toLocaleString();

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function renderCharts(stats) {
            const style = getComputedStyle(document.documentElement);
            const accent = style.getPropertyValue('--accent').trim() || '#0071E3';
            const success = style.getPropertyValue('--success').trim() || '#34C759';
            const warning = style.getPropertyValue('--warning').trim() || '#FF9F0A';
            const danger = style.getPropertyValue('--danger').trim() || '#FF3B30';
            const info = style.getPropertyValue('--info').trim() || '#5AC8FA';
            const purple = style.getPropertyValue('--purple').trim() || '#AF52DE';
            const textTertiary = style.getPropertyValue('--text-tertiary').trim() || '#86868B';
            const textSecondary = style.getPropertyValue('--text-secondary').trim() || '#6E6E73';

            // Mapeo de colores por canal (identidad de marca)
            const canalColors = {
                'WhatsApp': '#25D366E6',      // Verde WhatsApp
                'Instagram': '#C13584E6',     // Morado Instagram (gradiente central)
                'Facebook': '#1877F2E6',      // Azul Facebook
                'Referido': '#8E8E93E6',      // Gris neutro
                'Tienda': accent + 'E6'       // Accent del sistema
            };

            // Mapeo de colores por estado (psicología del color)
            const estadoColors = {
                'En Producción': accent + 'E6',              // Azul: trabajo en proceso
                'Listo para Envío': warning + 'E6',         // Naranja: acción necesaria
                'En Camino': info + 'E6',                   // Azul claro: en tránsito
                'Entregado': success + 'E6',                // Verde: éxito completado
                'Bloqueado - Sin Dirección': danger + 'E6', // Rojo: problema crítico
                'Bloqueado': danger + 'E6',                 // Rojo: problema crítico
                'Cancelado': textTertiary + '99'            // Gris: inactivo
            };

            // Apple-style Chart.js defaults
            const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
            const labelColor = isDarkMode ? '#D1D1D6' : textTertiary;

            Chart.defaults.font.family = "'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif";
            Chart.defaults.font.size = 12;
            Chart.defaults.color = labelColor;
            Chart.defaults.plugins.legend.labels.usePointStyle = true;
            Chart.defaults.plugins.legend.labels.padding = 16;
            Chart.defaults.plugins.legend.labels.boxWidth = 8;
            Chart.defaults.plugins.legend.labels.boxHeight = 8;
            Chart.defaults.elements.arc.borderWidth = 0;
            Chart.defaults.elements.bar.borderRadius = 8;

            // Canal chart
            const canalCtx = document.getElementById('chartCanal');
            if (!canalCtx) return;

            if (chartCanal) chartCanal.destroy();

            const canales = stats.ventas_por_canal || [];

            if (canales.length === 0) {
                // Mostrar mensaje cuando no hay datos
                const ctx = canalCtx.getContext('2d');
                ctx.clearRect(0, 0, canalCtx.width, canalCtx.height);
                ctx.font = '500 13px DM Sans, -apple-system, sans-serif';
                ctx.fillStyle = labelColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Sin datos', canalCtx.width / 2, canalCtx.height / 2);
            } else {
                chartCanal = new Chart(canalCtx, {
                    type: 'doughnut',
                    data: {
                        labels: canales.map(c => c.canal || 'Otro'),
                        datasets: [{
                            data: canales.map(c => c.total_pedidos || 0),
                            backgroundColor: canales.map(c => {
                                const canal = c.canal || 'Otro';
                                return canalColors[canal] || (accent + 'E6'); // Fallback al accent si no está mapeado
                            }),
                            borderWidth: 0,
                            spacing: 2,
                            offset: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                align: 'center',
                                labels: {
                                    padding: 14,
                                    usePointStyle: true,
                                    pointStyle: 'circle',
                                    font: {
                                        size: 12,
                                        weight: '500'
                                    },
                                    color: labelColor,
                                    boxWidth: 8,
                                    boxHeight: 8,
                                    generateLabels: function(chart) {
                                        const data = chart.data;
                                        return data.labels.map((label, i) => ({
                                            text: label,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            hidden: false,
                                            index: i,
                                            strokeStyle: 'transparent',
                                            lineWidth: 0
                                        }));
                                    }
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(28, 28, 30, 0.95)',
                                titleColor: '#F5F5F7',
                                bodyColor: '#F5F5F7',
                                padding: 12,
                                cornerRadius: 8,
                                displayColors: true,
                                boxPadding: 6,
                                usePointStyle: true,
                                callbacks: {
                                    label: function(context) {
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const value = context.parsed;
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return context.label + ': ' + value + ' (' + percentage + '%)';
                                    }
                                }
                            }
                        },
                        cutout: '70%',
                        animation: {
                            animateRotate: true,
                            animateScale: false,
                            duration: 800,
                            easing: 'easeOutQuart'
                        }
                    }
                });
            }

            // Estados chart
            const estadosCtx = document.getElementById('chartEstados');
            if (!estadosCtx) return;

            if (chartEstados) chartEstados.destroy();

            const estados = stats.pedidos_por_estado || [];

            if (estados.length === 0) {
                const ctx = estadosCtx.getContext('2d');
                ctx.clearRect(0, 0, estadosCtx.width, estadosCtx.height);
                ctx.font = '500 13px DM Sans, -apple-system, sans-serif';
                ctx.fillStyle = labelColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Sin datos', estadosCtx.width / 2, estadosCtx.height / 2);
            } else {
                chartEstados = new Chart(estadosCtx, {
                    type: 'bar',
                    data: {
                        labels: estados.map(e => e.estado || ''),
                        datasets: [{
                            data: estados.map(e => e.cantidad || 0),
                            backgroundColor: estados.map(e => {
                                const estado = e.estado || '';
                                return estadoColors[estado] || (textTertiary + '99'); // Fallback a gris si no está mapeado
                            }),
                            borderRadius: 8,
                            borderSkipped: false,
                            barThickness: 24
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        indexAxis: 'y',
                        layout: {
                            padding: {
                                right: 24
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(28, 28, 30, 0.95)',
                                titleColor: '#F5F5F7',
                                bodyColor: '#F5F5F7',
                                padding: 12,
                                cornerRadius: 8,
                                displayColors: false,
                                callbacks: {
                                    title: function(context) {
                                        return context[0].label;
                                    },
                                    label: function(context) {
                                        return context.parsed.x + ' pedidos';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    display: false,
                                    drawBorder: false
                                },
                                ticks: {
                                    display: false
                                },
                                border: {
                                    display: false
                                }
                            },
                            y: {
                                grid: {
                                    display: false,
                                    drawBorder: false
                                },
                                ticks: {
                                    font: {
                                        size: 12,
                                        weight: '500'
                                    },
                                    color: labelColor,
                                    padding: 12
                                },
                                border: {
                                    display: false
                                }
                            }
                        },
                        animation: {
                            duration: 800,
                            easing: 'easeOutQuart'
                        }
                    }
                });
            }
        }

        // ═══════ PENDIENTES ═══════
        async function cargarPendientes() {
            const container = document.getElementById('lista-pendientes');
            if (!container) return;

            showCardsSkeleton('lista-pendientes', 3);

            try {
                const pendientes = await api.getPedidosPendientes();

                if (!pendientes || !pendientes.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            ${emptyStateSVG()}
                            <h3>¡Todo al día!</h3>
                            <p>No hay pedidos pendientes</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = pendientes.map(p => `
                    <div class="pendiente-card">
                        <div>
                            <div style="font-family:var(--font-display);font-weight:700;font-size:var(--text-body);margin-bottom:4px;">
                                ${p.id || p.numero_pedido} — ${p.cliente || p.cliente_nombre}
                            </div>
                            <div style="font-size:var(--text-caption);color:var(--text-secondary);">
                                ${p.producto || p.producto_nombre} · ${p.talla || p.talla_seleccionada || ''}
                            </div>
                            <div style="font-size:var(--text-caption);color:var(--danger);margin-top:4px;font-weight:500;">
                                ${p.motivo_pendiente || p.motivo || 'Revisión pendiente'}
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="editarPedido('${p.id || p.numero_pedido}')" aria-label="Resolver pedido ${p.id || p.numero_pedido}">
                            Resolver
                        </button>
                    </div>
                `).join('');

            } catch (e) {
                console.error('Error pendientes:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="color:var(--danger);">Error al cargar pendientes</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
